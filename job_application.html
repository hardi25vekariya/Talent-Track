<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application - Talent Track</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <header>
        <div class="navbar">
            <div class="nav-logo">
                <img src="logo.jpg" alt="logo" style="height: 40px;">
            </div>
            <div class="site-title">Talent Track</div>
            <nav class="nav-item">
                <a href="index.html">Home</a>
                <a href="job_application.html" class="active">Job Application</a>
                <a href="universal_form_handler.php">View Submissions</a>
            </nav>
        </div>
    </header>

    <main style="max-width: 700px; margin: 50px auto; padding: 20px;">
        <div class="glass-form-wrapper">
            <form class="glass-form" action="universal_form_handler.php" method="POST">
                <!-- Hidden field to identify form -->
                <input type="hidden" name="form_name" value="job_application">
                
                <h2>Job Application Form</h2>
                <p style="text-align: center; color: #666;">
                    Apply for your dream job. Data will be saved automatically.
                </p>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <div class="glass-field">
                        <label for="first_name">First Name *</label>
                        <input type="text" id="first_name" name="first_name" required>
                    </div>
                    <div class="glass-field">
                        <label for="last_name">Last Name *</label>
                        <input type="text" id="last_name" name="last_name" required>
                    </div>
                </div>

                <div class="glass-field">
                    <label for="email">Email *</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="glass-field">
                    <label for="phone">Phone *</label>
                    <input type="tel" id="phone" name="phone" required>
                </div>

                <div class="glass-field">
                    <label for="position">Position Applied For *</label>
                    <input type="text" id="position" name="position" required>
                </div>

                <div class="glass-field">
                    <label for="experience">Years of Experience</label>
                    <select id="experience" name="experience">
                        <option value="">Select</option>
                        <option value="0-1">0-1 years</option>
                        <option value="1-3">1-3 years</option>
                        <option value="3-5">3-5 years</option>
                        <option value="5+">5+ years</option>
                    </select>
                </div>

                <div class="glass-field">
                    <label for="skills">Technical Skills</label>
                    <textarea id="skills" name="skills" rows="3" placeholder="List your technical skills..."></textarea>
                </div>

                <div class="glass-field">
                    <label for="cover_letter">Cover Letter</label>
                    <textarea id="cover_letter" name="cover_letter" rows="4" placeholder="Why are you interested in this position?..."></textarea>
                </div>

                <div class="glass-actions">
                    <button type="submit" class="glass-btn primary">Submit Application</button>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
